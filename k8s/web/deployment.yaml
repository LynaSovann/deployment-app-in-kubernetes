apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-web
  namespace: k8s-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-web
  template:
    metadata:
      labels:
        app: k8s-web
    spec:
      containers:
        - name: k8s-web
          image: lynakiddy/k8s-web
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://kubernetes.lynasovann.site/api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 3000
